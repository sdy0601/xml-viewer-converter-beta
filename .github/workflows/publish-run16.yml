name: Publish run16 beta asset

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download run16 visual acceptance artifact bundle
        shell: pwsh
        run: |
          $url = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f480-81f4-983b-c908a9c388d5/raw?se=2026-09-23T07%3A38%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=ead132d1-bd6d-5f97-8c33-d5845211632e&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T06%3A55%3A11Z&ske=2026-09-24T06%3A55%3A11Z&sks=b&skv=2026-02-06&sig=28UiZ2DHsZNKXaOm%2Bt4pIjEgl4RPIEYraF3g6p6Y4Vg%3D'
          Invoke-WebRequest -Uri $url -OutFile run16-artifact.zip
          Expand-Archive -LiteralPath run16-artifact.zip -DestinationPath unpacked -Force
          $inner = Get-ChildItem -LiteralPath unpacked -Filter *.zip -File -Recurse | Select-Object -First 1
          if (-not $inner) { throw "No inner Windows package ZIP found." }
          $expected = "ff216ad56bdc167f60813c09a784969016bf635aa834848716f128b67c5b96da"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $inner.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected package SHA256: $actual" }
          Copy-Item -LiteralPath $inner.FullName -Destination "XML-Viewer-Converter-v0.1.0-beta-windows-x64-FINAL.zip"

      - name: Replace public beta release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0-beta "XML-Viewer-Converter-v0.1.0-beta-windows-x64-FINAL.zip" --clobber
